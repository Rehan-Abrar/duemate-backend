  {"intent":"schedule_query","language":"en","schedule":{"query_type":"full_timetable","course":null,"teacher":null,"section":"BSCS 7B","day":null,"time_after":null,"time_before":null},"confidence":0.98}

  Message: "BSCS 7A ka timetable"
